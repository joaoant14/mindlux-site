<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <title>Quiz MindLux — Diagnóstico de Sombra</title>
  
  <!-- Meta tags SEO -->
  <meta name="description" content="Quiz MindLux: Identifique qual parte de você está operando nas sombras e descubra o caminho concreto para integrá-la.">
  <meta name="robots" content="index, follow">
  
  <!-- Google Fonts importados diretamente -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  
  <!-- Favicon sutil -->
  <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✧</text></svg>">

  <style>
    /* ==========================================================================
       MINDLUX DESIGN SYSTEM & PRESET STYLES
       ========================================================================== */
    :root {
      --color-primary: #4B3FD4;
      --color-primary-hover: #6358E8;
      --color-primary-glow: #8B82F0;
      --color-primary-subtle: rgba(75, 63, 212, 0.18);
      --color-bg-main: #08071A;
      --color-bg-card: #100F2E;
      --color-border: #2A2560;
      --color-text-main: #EBE9F8;
      --color-text-secondary: #9490B8;
      --color-integration: #22B8A0;
      --color-bg-affirmation: #0A1F1D;
      
      --color-buy: #1A9E6E;
      --color-buy-hover: #22B8A0;
      --color-bg-product: #0D0D24;
      --color-bg-bump: #0A0A1F;
      --color-bump-active: rgba(26, 158, 110, 0.12);
      
      --font-serif: "Playfair Display", Georgia, serif;
      --font-sans: "DM Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      
      --transition-fade: 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      --transition-spring: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      
      --border-radius-card: 24px;
      --border-radius-btn: 12px;
      --border-radius-opt: 16px;
      
      --container-max-width: 640px;
    }

    /* Base Reset */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--color-bg-main);
      color: var(--color-text-main);
      font-family: var(--font-sans);
      line-height: 1.6;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: background-color var(--transition-fade);
      position: relative;
    }

    body.affirmation-mode {
      background-color: var(--color-bg-affirmation);
    }

    /* Fundo Gradiente Onírico */
    body::before {
      content: "";
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(75, 63, 212, 0.15) 0%, rgba(8, 7, 26, 0) 70%);
      top: -100px;
      left: -100px;
      pointer-events: none;
      z-index: 1;
      animation: float 8s infinite ease-in-out;
    }

    body::after {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139, 130, 240, 0.1) 0%, rgba(8, 7, 26, 0) 70%);
      bottom: -150px;
      right: -150px;
      pointer-events: none;
      z-index: 1;
      animation: float 12s infinite ease-in-out reverse;
    }

    /* Top Progress Bar Container */
    .progress-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background-color: rgba(235, 233, 248, 0.05);
      z-index: 1000;
      opacity: 1;
      transition: opacity var(--transition-fade);
    }

    .progress-container.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .progress-bar {
      height: 100%;
      background-color: var(--color-primary);
      width: 0%;
      box-shadow: 0 0 10px var(--color-primary-glow);
      transition: width var(--transition-fade);
    }

    /* Core Layout */
    .app-container {
      width: 100%;
      max-width: var(--container-max-width);
      padding: 40px 20px;
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100vh;
    }

    .quiz-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Back Button Container */
    .back-button-container {
      width: 100%;
      min-height: 40px;
      display: flex;
      justify-content: flex-start;
      margin-bottom: 16px;
    }

    .btn-back {
      display: flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: none;
      color: var(--color-text-secondary);
      font-family: var(--font-sans);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      padding: 6px 0;
      transition: color var(--transition-fade), transform var(--transition-fade);
    }

    .btn-back:hover {
      color: var(--color-text-main);
      transform: translateX(-3px);
    }

    /* Screen Wrapper & Custom Fade Transitions */
    .screen {
      width: 100%;
      display: flex;
      flex-direction: column;
      opacity: 0;
      transform: translateY(15px);
      animation: screenFadeIn var(--transition-fade) forwards;
      will-change: transform, opacity;
    }

    .screen.fade-out {
      animation: screenFadeOut var(--transition-fade) forwards;
    }

    @keyframes screenFadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes screenFadeOut {
      to {
        opacity: 0;
        transform: translateY(-15px);
      }
    }

    /* Badge Welcome */
    .badge-welcome {
      align-self: center;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: var(--color-primary-glow);
      margin-bottom: 20px;
      font-weight: 600;
      text-shadow: 0 0 8px rgba(139, 130, 240, 0.35);
    }

    /* Typography */
    h1, h2, h3 {
      font-family: var(--font-serif);
      font-weight: 500;
      line-height: 1.35;
      letter-spacing: -0.01em;
      color: var(--color-text-main);
    }

    .headline-intro {
      font-size: 2.2rem;
      text-align: center;
      margin-bottom: 24px;
    }

    @media (min-width: 600px) {
      .headline-intro {
        font-size: 2.8rem;
      }
    }

    .text-body {
      font-size: 1.05rem;
      font-weight: 300;
      color: var(--color-text-secondary);
      line-height: 1.65;
      text-align: center;
      margin-bottom: 32px;
    }

    .text-body-left {
      font-size: 1.05rem;
      font-weight: 300;
      color: var(--color-text-secondary);
      line-height: 1.65;
      text-align: left;
    }

    /* Cards/Options */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      margin-top: 10px;
    }

    .option-card {
      background-color: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: var(--border-radius-opt);
      padding: 18px 20px;
      cursor: pointer;
      text-align: left;
      outline: none;
      font-family: var(--font-sans);
      color: var(--color-text-main);
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      user-select: none;
      transition: border-color var(--transition-fade), background-color var(--transition-fade), transform var(--transition-fade), box-shadow var(--transition-fade);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      min-height: 60px;
    }

    .option-card:hover {
      border-color: rgba(139, 130, 240, 0.45);
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.55);
    }

    .option-card:active {
      transform: translateY(0);
    }

    .option-card.selected {
      background-color: var(--color-primary-subtle);
      border-color: var(--color-primary);
      box-shadow: 0 0 18px rgba(75, 63, 212, 0.25);
    }

    .option-emoji {
      font-size: 1.4rem;
      flex-shrink: 0;
      line-height: 1;
    }

    .option-text {
      font-size: 1.02rem;
      font-weight: 300;
      line-height: 1.5;
      flex-grow: 1;
      color: var(--color-text-main);
    }

    /* Custom Checked Indicator on Right */
    .option-marker {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1.5px solid var(--color-text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-left: auto;
      transition: all var(--transition-fade);
    }

    .option-card.selected .option-marker {
      background-color: var(--color-primary);
      border-color: var(--color-primary);
    }

    .option-marker::after {
      content: "✓";
      font-size: 0.75rem;
      font-weight: bold;
      color: var(--color-text-main);
      opacity: 0;
      transform: scale(0.5);
      transition: all var(--transition-fade);
    }

    .option-card.selected .option-marker::after {
      opacity: 1;
      transform: scale(1);
    }

    /* Buttons */
    .btn-primary {
      background-color: var(--color-primary);
      color: var(--color-text-main);
      border: none;
      border-radius: var(--border-radius-btn);
      padding: 16px 36px;
      font-family: var(--font-sans);
      font-size: 1.05rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color var(--transition-fade), transform var(--transition-fade), box-shadow var(--transition-fade);
      text-align: center;
      box-shadow: 0 4px 18px rgba(75, 63, 212, 0.35);
      outline: none;
      align-self: center;
      min-width: 200px;
      letter-spacing: 0.02em;
    }

    .btn-primary:hover {
      background-color: var(--color-primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(99, 88, 232, 0.55);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary.hidden-btn {
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
    }
    
    .btn-primary.show-btn {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .microcopy-below {
      font-size: 0.85rem;
      color: var(--color-text-secondary);
      text-align: center;
      margin-top: 18px;
      letter-spacing: 0.04em;
    }

    /* Question Screen Layout */
    .question-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .question-subtitle {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--color-primary-glow);
      margin-bottom: 10px;
      display: inline-block;
      font-weight: 500;
    }

    .question-title {
      font-size: 1.7rem;
      line-height: 1.35;
      color: var(--color-text-main);
      font-family: var(--font-serif);
      margin-top: 4px;
    }

    /* Affirmation Screen CSS */
    .affirmation-box {
      text-align: center;
      max-width: 580px;
      align-self: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .affirmation-badge {
      font-size: 2rem;
      color: var(--color-integration);
      margin-bottom: 20px;
      text-shadow: 0 0 12px rgba(34, 184, 160, 0.4);
      animation: pulse 3s infinite ease-in-out;
    }

    .affirmation-text-lead {
      font-family: var(--font-serif);
      font-size: 1.45rem;
      line-height: 1.65;
      color: var(--color-text-main);
      margin-bottom: 32px;
      font-weight: 400;
      text-align: center;
    }

    @media (min-width: 600px) {
      .affirmation-text-lead {
        font-size: 1.65rem;
      }
    }

    /* Thermometer Component styling */
    .thermometer-wrapper {
      width: 100%;
      background: rgba(235, 233, 248, 0.03);
      border: 1px solid var(--color-border);
      border-radius: var(--border-radius-card);
      padding: 32px 24px;
      margin: 24px 0 32px 0;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .thermometer-value {
      font-family: var(--font-serif);
      font-size: 4.5rem;
      font-weight: 700;
      color: var(--color-text-main);
      line-height: 1;
      margin-bottom: 8px;
      text-shadow: 0 0 25px rgba(139, 130, 240, 0.45);
    }

    .thermometer-badge {
      display: inline-block;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      background: var(--color-primary-subtle);
      color: var(--color-primary-glow);
      border: 1px solid rgba(139, 130, 240, 0.2);
      margin-bottom: 24px;
    }

    .thermometer-track {
      width: 100%;
      max-width: 440px;
      height: 12px;
      background: rgba(8, 7, 26, 0.7);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(235, 233, 248, 0.1);
    }

    .thermometer-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--color-primary) 0%, var(--color-primary-glow) 100%);
      border-radius: 6px;
      box-shadow: 0 0 14px var(--color-primary-glow);
      transition: width 1.8s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Email Capture Form styling */
    .capture-form {
      width: 100%;
      max-width: 440px;
      margin: 28px auto 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
    }

    .input-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--color-text-secondary);
      font-weight: 500;
    }

    .input-field {
      border: 1px solid var(--color-border);
      border-radius: var(--border-radius-btn);
      padding: 16px 18px;
      font-family: var(--font-sans);
      font-size: 1.05rem;
      color: var(--color-text-main);
      background-color: var(--color-bg-card);
      outline: none;
      transition: border-color var(--transition-fade), box-shadow var(--transition-fade), background-color var(--transition-fade);
      width: 100%;
    }

    .input-field:focus {
      border-color: var(--color-primary-glow);
      box-shadow: 0 0 12px rgba(139, 130, 240, 0.25);
      background-color: rgba(16, 15, 46, 0.95);
    }

    .input-field::placeholder {
      color: rgba(148, 144, 184, 0.45);
    }

    .inline-error-msg {
      font-size: 0.85rem;
      color: #ff5252;
      margin-top: 4px;
      display: none;
    }

    .input-group.has-error .input-field {
      border-color: #ff5252;
    }

    .input-group.has-error .inline-error-msg {
      display: block;
    }

    /* Analysis Loading Screen styling */
    .analysis-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 460px;
      margin: 0 auto;
      width: 100%;
    }

    .spinner-ring-container {
      position: relative;
      width: 76px;
      height: 76px;
      margin-bottom: 36px;
    }

    .spinner-background-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 2px solid rgba(139, 130, 240, 0.08);
      border-radius: 50%;
    }

    .spinner-spinning-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 2px solid transparent;
      border-top-color: var(--color-primary-glow);
      border-radius: 50%;
      animation: rotate 1.2s infinite cubic-bezier(0.5, 0, 0.5, 1);
    }

    .spinner-center-star {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.35rem;
      color: var(--color-primary-glow);
      animation: pulse 2s infinite ease-in-out;
    }

    .analysis-steps-list {
      width: 100%;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .analysis-step-row {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.05rem;
      color: var(--color-text-secondary);
      opacity: 0.3;
      transition: all var(--transition-fade);
    }

    .analysis-step-row.active {
      opacity: 1;
      color: var(--color-text-main);
    }

    .analysis-step-row.completed {
      opacity: 1;
      color: var(--color-text-main);
    }

    .analysis-step-row.completed .step-row-icon {
      color: var(--color-integration);
      text-shadow: 0 0 6px rgba(34, 184, 160, 0.5);
      font-weight: bold;
    }

    .step-row-icon {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-weight: 500;
    }

    /* Result Screen Premium styling */
    .result-outer-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .result-glow-header {
      position: relative;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 0 16px 0;
      z-index: 10;
    }

    .result-glow-halo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139, 130, 240, 0.16) 0%, rgba(8, 7, 26, 0) 70%);
      z-index: -1;
      filter: blur(25px);
      pointer-events: none;
      animation: pulse 4s infinite ease-in-out;
    }

    .result-top-badge {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.20em;
      color: var(--color-primary-glow);
      margin-bottom: 12px;
      font-weight: 600;
      text-shadow: 0 0 10px rgba(139, 130, 240, 0.3);
    }

    .result-main-title {
      font-size: 2.1rem;
      line-height: 1.3;
      margin-bottom: 8px;
      color: var(--color-text-main);
    }

    @media (min-width: 600px) {
      .result-main-title {
        font-size: 2.6rem;
      }
    }

    .profile-glow-name {
      color: var(--color-primary-glow);
      font-family: var(--font-serif);
      font-style: italic;
      display: block;
      margin-top: 6px;
      font-size: 2.3rem;
      text-shadow: 0 0 20px rgba(139, 130, 240, 0.35);
    }

    @media (min-width: 600px) {
      .profile-glow-name {
        font-size: 3rem;
      }
    }

    /* 3D Orb Visual container */
    .orb-visual-box {
      position: relative;
      width: 150px;
      height: 150px;
      margin: 8px auto 24px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .orb-background-fog {
      position: absolute;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--color-primary-glow) 0%, rgba(8, 7, 26, 0.8) 75%);
      opacity: 0.22;
      animation: orbRotate 12s infinite linear;
      filter: blur(8px);
    }

    .orb-core-sphere {
      position: relative;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--color-primary-glow) 0%, var(--color-primary) 50%, rgba(16, 15, 46, 0) 100%);
      box-shadow: 0 0 30px rgba(139, 130, 240, 0.45), inset 0 0 18px rgba(75, 63, 212, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: float 4s infinite ease-in-out;
    }

    .orb-core-sphere::after {
      content: "✧";
      color: var(--color-text-main);
      font-size: 1.7rem;
      opacity: 0.9;
      text-shadow: 0 0 8px var(--color-text-main);
    }

    /* Narrative text blocks */
    .result-text-article {
      display: flex;
      flex-direction: column;
      gap: 20px;
      text-align: left;
    }

    .result-paragraph {
      font-size: 1.1rem;
      line-height: 1.7;
      color: var(--color-text-secondary);
      font-weight: 300;
    }

    .result-paragraph strong {
      color: var(--color-text-main);
      font-weight: 500;
    }

    /* Integration final block ("O que muda") */
    .integration-box-card {
      background-color: var(--color-bg-affirmation);
      border: 1px solid rgba(34, 184, 160, 0.22);
      border-radius: var(--border-radius-card);
      padding: 28px 24px;
      margin-top: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    .integration-box-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background-color: var(--color-integration);
    }

    .integration-box-title {
      font-family: var(--font-serif);
      font-size: 1.35rem;
      color: var(--color-text-main);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .integration-box-title::before {
      content: "✧";
      color: var(--color-integration);
      font-size: 1.1rem;
      text-shadow: 0 0 6px rgba(34, 184, 160, 0.5);
    }

    .integration-box-text {
      font-size: 1.08rem;
      line-height: 1.7;
      color: var(--color-integration);
      opacity: 0.95;
      font-weight: 300;
    }

    /* KEYFRAME ANIMATIONS */
    @keyframes float {
      0%, 100% {
        transform: translateY(0px) scale(1);
      }
      50% {

    function calcularResultados() {
      const r = state.responses;

      // ARQUÉTIPO
      // Protetor — medo de abandono e intimidade: Q6, Q7, Q11
      let protetor = 0, invisivel = 0, controlador = 0, indigno = 0;
      if (r.Q6 === "A") protetor += 3;        // isolado — sinal mais forte

      if (r.Q4 === "A") invisivel += 3;       // guarda o que sente — sinal mais forte

      {id:"email",type:"email",render:()=>`<div class="screen" style="display:flex;flex-direction:column;align-items:center;"><div style="text-align:center;margin-bottom:32px;"><span style="font-size:0.85rem;text-transform:uppercase;letter-spacing:0.2em;color:var(--color-primary-glow);font-weight:600;">Seu resultado está pronto</span><h2 style="font-family:var(--font-serif);font-size:2rem;color:var(--color-text-main);margin-top:12px;line-height:1.3;">Digite seu email para receber seu Plano de Shadow Work personalizado</h2></div><div style="width:100%;max-width:440px;display:flex;flex-direction:column;gap:16px;"><input type="email" id="email-input" placeholder="seu@email.com" style="border:1px solid var(--color-border);border-radius:12px;padding:16px 18px;font-family:var(--font-sans);font-size:1.05rem;color:var(--color-text-main);background-color:var(--color-bg-card);outline:none;width:100%;"><p id="email-error" style="color:#ff5252;font-size:0.85rem;display:none;">Por favor, insira um email válido.</p><button id="btn-email-next" class="btn-primary" style="width:100%;padding:16px;">Ver meu resultado →</button><p style="font-size:0.82rem;color:var(--color-text-secondary);text-align:center;line-height:1.5;">🔒 Respeitamos sua privacidade. Seu email nunca será compartilhado.</p></div></div>`,
      setup:()=>{
        const input=document.getElementById("email-input");
        const btn=document.getElementById("btn-email-next");
        const err=document.getElementById("email-error");
        input.addEventListener("focus",()=>{input.style.borderColor="var(--color-primary-glow)";});
        input.addEventListener("blur",()=>{input.style.borderColor="var(--color-border)";});
        btn.addEventListener("click",()=>{
          const email=input.value.trim();
          const valid=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
          if(!valid){err.style.display="block";input.style.borderColor="#ff5252";return;}
          err.style.display="none";
          state.email=email;
          const arqNome=ARQUETIPOS[state.arquetipo]?.nome||state.arquetipo;
          const formData = new FormData();
          formData.append('email', email);
          formData.append('arquetipo', arqNome);
          formData.append('impacto', state.impacto + '%');
          formData.append('autoconfianca', state.autoconfianca);
          formData.append('pessimismo', state.pessimismo + '%');
          fetch(SHEETS_URL, {method: 'POST', mode: 'no-cors', body: formData}).catch(()=>{});
          if(typeof gtag==="function")gtag('event','email_capturado',{arquetipo:arqNome});
          if(typeof fbq==="function")fbq('track','Lead');
          nextScreen();
        });
      }},

        document.getElementById("btn-action-back").addEventListener("click", () => {
          prevScreen();
        });
      }
    }

    // --- GERENCIADOR DE TRANSITIONS DE TELA (300ms) ---
    function renderScreen(index) {
      const screen = SCREENS[index];
      if (!screen) return;

      const currentScreenEl = screenViewport.querySelector(".screen");
      if (currentScreenEl) {
        currentScreenEl.classList.add("fade-out");
        // Aguarda fim do fade-out (300ms) antes de injetar e fade-in o próximo
        setTimeout(() => {
          injectAndSetupScreen(screen);
        }, 300);
      } else {
        injectAndSetupScreen(screen);
      }
    }

    // --- MAPA DE NOMES LEGÍVEIS PARA CADA TELA ---
    const SCREEN_LABELS = {
      "Q1":"Pergunta_1","social_proof":"Prova_Social","Q2":"Pergunta_2",
      "q2_response":"Resposta_Q2","Q3":"Pergunta_3","Q4":"Pergunta_4",
      "Q5":"Pergunta_5","Q6":"Pergunta_6","Q7":"Pergunta_7","jung1":"Jung_1",
      "Q8":"Pergunta_8","Q9":"Pergunta_9","Q10":"Pergunta_10","Q11":"Pergunta_11",
      "Q12":"Pergunta_12","Q13":"Pergunta_13","jung2":"Jung_2","Q14":"Pergunta_14",
      "Q15":"Pergunta_15","Q16":"Pergunta_16","Q17":"Pergunta_17","jung3":"Jung_3",
      "Q18":"Pergunta_18","Q19":"Pergunta_19","Q20":"Pergunta_20","Q21":"Pergunta_21",
      "citation_q21":"Citacao_Q21","Q22":"Pergunta_22","Q23":"Pergunta_23",
      "analysis":"Analise","email":"Email","checkout1":"Checkout_1",
      "checkout2":"Checkout_2","checkout3":"Checkout_3","checkout4":"Checkout_4",
      "checkout5":"Checkout_5","checkout6":"Checkout_6","result":"Resultado"
    };

    function trackScreen(screenId) {
      const label = SCREEN_LABELS[screenId] || screenId;
      if (typeof fbq === "function") fbq('trackCustom', 'QuizStep', { step: label });
      if (typeof gtag === "function") gtag('event', 'quiz_step', { step_name: label, step_id: screenId });
    }

    function injectAndSetupScreen(screen) {
      screenViewport.innerHTML = screen.render();
      
      // Scroll suave ao topo da tela
      window.scrollTo({ top: 0, behavior: "smooth" });

      // Modo de Afirmação (fundo teal escuro de pausa)
      if (screen.type === "affirmation") {
        body.classList.add("affirmation-mode");
      } else {
        body.classList.remove("affirmation-mode");
      }

      updateProgressBar(screen);
      renderBackButton(screen);

      // Tracking por tela
      trackScreen(screen.id);

      if (screen.setup) {
        screen.setup();
      }
    }

    // --- CONTROLE DE NAVEGAÇÃO ---
    function nextScreen() {
      if (state.currentScreenIndex < SCREENS.length - 1) {
        state.currentScreenIndex++;
        renderScreen(state.currentScreenIndex);
      }
    }

    function prevScreen() {
      if (state.currentScreenIndex > 0) {
        state.currentScreenIndex--;
        renderScreen(state.currentScreenIndex);
      }
    }

    // --- TELA DE CONFIRMAÇÃO DO PROTOCOLO ---
    // --- TELA DE OFERTA EXPIRADA ---
    function renderExpiredScreen() {
      progressContainer.classList.add("hidden");
      backButtonContainer.innerHTML = "";
      body.classList.remove("affirmation-mode");
      screenViewport.innerHTML = `
        <div class="screen" style="display:flex;flex-direction:column;align-items:center;text-align:center;padding:20px 0;">
          <span style="font-size:3rem;margin-bottom:16px;">⏰</span>
          <h2 style="font-family:var(--font-serif);font-size:1.8rem;color:var(--color-text-main);line-height:1.35;margin-bottom:16px;">A oferta com desconto expirou.</h2>
          <p style="font-size:1rem;color:var(--color-text-secondary);line-height:1.7;max-width:420px;margin-bottom:32px;">
            O tempo para o preço especial de R$ 19,90 encerrou. Mas você ainda pode acessar o Protocolo pelo valor original.
          </p>
          <div style="background:var(--color-bg-product);border:1px solid var(--color-border);border-radius:20px;padding:28px 24px;width:100%;max-width:440px;margin-bottom:24px;">
            <h3 style="font-family:var(--font-serif);font-size:1.5rem;color:var(--color-text-main);margin-bottom:8px;">O Protocolo dos 3 Dias</h3>
            <div style="font-family:var(--font-serif);font-size:2.8rem;font-weight:700;color:var(--color-text-main);margin:16px 0;">R$ 109,90</div>
            <button id="btn-buy-expired" class="btn-buy-now" style="font-size:1rem;min-height:56px;">
              ACESSAR O PROTOCOLO →
            </button>
            <div style="margin-top:16px;display:flex;align-items:center;justify-content:center;gap:8px;">
              <span style="font-size:1.1rem;">🛡️</span>
              <p style="font-size:0.8rem;color:var(--color-text-secondary);">Garantia de 7 dias · Pagamento 100% seguro</p>
            </div>
          </div>
        </div>
      `;
      const btn = document.getElementById("btn-buy-expired");
      if(btn){
        btn.addEventListener("click",()=>{
          fbq('track','InitiateCheckout');
          if(typeof gtag==="function")gtag('event','compra_apos_expiracao',{arquetipo:state.arquetipo});
          window.open('https://pay.kiwify.com.br/APFNbz9','_blank');
        });
      }
    }

    // --- TELA DE CONFIRMAÇÃO ---
    function renderConfirmationScreen() {
      progressContainer.classList.add("hidden");
      backButtonContainer.innerHTML = "";
      body.classList.add("affirmation-mode");
      
      screenViewport.innerHTML = `
        <div class="screen">
          <div class="affirmation-box" style="padding: 40px 20px;">
            <span class="affirmation-badge" style="font-size: 2.5rem; margin-bottom: 24px;">✧</span>
            <h1 style="font-family: var(--font-serif); font-size: 2rem; color: var(--color-text-main); line-height: 1.4; text-align: center; margin-bottom: 20px;">
              Parabéns.
            </h1>
            <p style="font-family: var(--font-sans); font-size: 1.15rem; color: var(--color-text-secondary); line-height: 1.7; text-align: center; max-width: 500px;">
              Você deu um passo importante na sua jornada.<br>
              Fica de olho no seu email após concluir a compra.
            </p>
          </div>
        </div>
      `;
    }

    // --- CARGA INICIAL DO QUIZ ---
    renderScreen(state.currentScreenIndex);

  </script>
</body>
</html>
