<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <title>Quiz MindLux — Diagnóstico de Sombra</title>
  
  <!-- Meta tags SEO -->
  <meta name="description" content="Quiz MindLux: Identifique qual parte de você está operando nas sombras e descubra o caminho concreto para integrá-la.">
  <meta name="robots" content="index, follow">
  
  <!-- Google Fonts importados diretamente -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  
  <!-- Favicon sutil -->
  <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✧</text></svg>">

  <style>
    /* ==========================================================================
       MINDLUX DESIGN SYSTEM & PRESET STYLES
       ========================================================================== */
    :root {
      --color-primary: #4B3FD4;
      --color-primary-hover: #6358E8;
      --color-primary-glow: #8B82F0;
      --color-primary-subtle: rgba(75, 63, 212, 0.18);
      --color-bg-main: #08071A;
      --color-bg-card: #100F2E;
      --color-border: #2A2560;
      --color-text-main: #EBE9F8;
      --color-text-secondary: #9490B8;
      --color-integration: #22B8A0;
      --color-bg-affirmation: #0A1F1D;
      
      --color-buy: #1A9E6E;
      --color-buy-hover: #22B8A0;
      --color-bg-product: #0D0D24;
      --color-bg-bump: #0A0A1F;
      --color-bump-active: rgba(26, 158, 110, 0.12);
      
      --font-serif: "Playfair Display", Georgia, serif;
      --font-sans: "DM Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      
      --transition-fade: 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      --transition-spring: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      
      --border-radius-card: 24px;
      --border-radius-btn: 12px;
      --border-radius-opt: 16px;
      
      --container-max-width: 640px;
    }

    /* Base Reset */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--color-bg-main);
      color: var(--color-text-main);
      font-family: var(--font-sans);
      line-height: 1.6;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: background-color var(--transition-fade);
      position: relative;
    }

    body.affirmation-mode {
      background-color: var(--color-bg-affirmation);
    }

    /* Fundo Gradiente Onírico */
    body::before {
      content: "";
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(75, 63, 212, 0.15) 0%, rgba(8, 7, 26, 0) 70%);
      top: -100px;
      left: -100px;
      pointer-events: none;
      z-index: 1;
      animation: float 8s infinite ease-in-out;
    }

    body::after {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139, 130, 240, 0.1) 0%, rgba(8, 7, 26, 0) 70%);
      bottom: -150px;
      right: -150px;
      pointer-events: none;
      z-index: 1;
      animation: float 12s infinite ease-in-out reverse;
    }

    /* Top Progress Bar Container */
    .progress-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background-color: rgba(235, 233, 248, 0.05);
      z-index: 1000;
      opacity: 1;
      transition: opacity var(--transition-fade);
    }

    .progress-container.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .progress-bar {
      height: 100%;
      background-color: var(--color-primary);
      width: 0%;
      box-shadow: 0 0 10px var(--color-primary-glow);
      transition: width var(--transition-fade);
    }

    /* Core Layout */
    .app-container {
      width: 100%;
      max-width: var(--container-max-width);
      padding: 40px 20px;
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100vh;
    }

    .quiz-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Back Button Container */
    .back-button-container {
      width: 100%;
      min-height: 40px;
      display: flex;
      justify-content: flex-start;
      margin-bottom: 16px;
    }

    .btn-back {
      display: flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: none;
      color: var(--color-text-secondary);
      font-family: var(--font-sans);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      padding: 6px 0;
      transition: color var(--transition-fade), transform var(--transition-fade);
    }

    .btn-back:hover {
      color: var(--color-text-main);
      transform: translateX(-3px);
    }

    /* Screen Wrapper & Custom Fade Transitions */
    .screen {
      width: 100%;
      display: flex;
      flex-direction: column;
      opacity: 0;
      transform: translateY(15px);
      animation: screenFadeIn var(--transition-fade) forwards;
      will-change: transform, opacity;
    }

    .screen.fade-out {
      animation: screenFadeOut var(--transition-fade) forwards;
    }

    @keyframes screenFadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes screenFadeOut {
      to {
        opacity: 0;
        transform: translateY(-15px);
      }
    }

    /* Badge Welcome */
    .badge-welcome {
      align-self: center;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: var(--color-primary-glow);
      margin-bottom: 20px;
      font-weight: 600;
      text-shadow: 0 0 8px rgba(139, 130, 240, 0.35);
    }

    /* Typography */
    h1, h2, h3 {
      font-family: var(--font-serif);
      font-weight: 500;
      line-height: 1.35;
      letter-spacing: -0.01em;
      color: var(--color-text-main);
    }

    .headline-intro {
      font-size: 2.2rem;
      text-align: center;
      margin-bottom: 24px;
    }

    @media (min-width: 600px) {
      .headline-intro {
        font-size: 2.8rem;
      }
    }

    .text-body {
      font-size: 1.05rem;
      font-weight: 300;
      color: var(--color-text-secondary);
      line-height: 1.65;
      text-align: center;
      margin-bottom: 32px;
    }

    .text-body-left {
      font-size: 1.05rem;
      font-weight: 300;
      color: var(--color-text-secondary);
      line-height: 1.65;
      text-align: left;
    }

    /* Cards/Options */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      margin-top: 10px;
    }

    .option-card {
      background-color: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: var(--border-radius-opt);
      padding: 18px 20px;
      cursor: pointer;
      text-align: left;
      outline: none;
      font-family: var(--font-sans);
      color: var(--color-text-main);
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      user-select: none;
      transition: border-color var(--transition-fade), background-color var(--transition-fade), transform var(--transition-fade), box-shadow var(--transition-fade);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      min-height: 60px;
    }

    .option-card:hover {
      border-color: rgba(139, 130, 240, 0.45);
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.55);
    }

    .option-card:active {
      transform: translateY(0);
    }

    .option-card.selected {
      background-color: var(--color-primary-subtle);
      border-color: var(--color-primary);
      box-shadow: 0 0 18px rgba(75, 63, 212, 0.25);
    }

    .option-emoji {
      font-size: 1.4rem;
      flex-shrink: 0;
      line-height: 1;
    }

    .option-text {
      font-size: 1.02rem;
      font-weight: 300;
      line-height: 1.5;
      flex-grow: 1;
      color: var(--color-text-main);
    }

    /* Custom Checked Indicator on Right */
    .option-marker {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1.5px solid var(--color-text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-left: auto;
      transition: all var(--transition-fade);
    }

    .option-card.selected .option-marker {
      background-color: var(--color-primary);
      border-color: var(--color-primary);
    }

    .option-marker::after {
      content: "✓";
      font-size: 0.75rem;
      font-weight: bold;
      color: var(--color-text-main);
      opacity: 0;
      transform: scale(0.5);
      transition: all var(--transition-fade);
    }

    .option-card.selected .option-marker::after {
      opacity: 1;
      transform: scale(1);
    }

    /* Buttons */
    .btn-primary {
      background-color: var(--color-primary);
      color: var(--color-text-main);
      border: none;
      border-radius: var(--border-radius-btn);
      padding: 16px 36px;
      font-family: var(--font-sans);
      font-size: 1.05rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color var(--transition-fade), transform var(--transition-fade), box-shadow var(--transition-fade);
      text-align: center;
      box-shadow: 0 4px 18px rgba(75, 63, 212, 0.35);
      outline: none;
      align-self: center;
      min-width: 200px;
      letter-spacing: 0.02em;
    }

    .btn-primary:hover {
      background-color: var(--color-primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(99, 88, 232, 0.55);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary.hidden-btn {
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
    }
    
    .btn-primary.show-btn {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .microcopy-below {
      font-size: 0.85rem;
      color: var(--color-text-secondary);
      text-align: center;
      margin-top: 18px;
      letter-spacing: 0.04em;
    }

    /* Question Screen Layout */
    .question-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .question-subtitle {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--color-primary-glow);
      margin-bottom: 10px;
      display: inline-block;
      font-weight: 500;
    }

    .question-title {
      font-size: 1.7rem;
      line-height: 1.35;
      color: var(--color-text-main);
      font-family: var(--font-serif);
      margin-top: 4px;
    }

    /* Affirmation Screen CSS */
    .affirmation-box {
      text-align: center;
      max-width: 580px;
      align-self: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .affirmation-badge {
      font-size: 2rem;
      color: var(--color-integration);
      margin-bottom: 20px;
      text-shadow: 0 0 12px rgba(34, 184, 160, 0.4);
      animation: pulse 3s infinite ease-in-out;
    }

    .affirmation-text-lead {
      font-family: var(--font-serif);
      font-size: 1.45rem;
      line-height: 1.65;
      color: var(--color-text-main);
      margin-bottom: 32px;
      font-weight: 400;
      text-align: center;
    }

    @media (min-width: 600px) {
      .affirmation-text-lead {
        font-size: 1.65rem;
      }
    }

    /* Thermometer Component styling */
    .thermometer-wrapper {
      width: 100%;
      background: rgba(235, 233, 248, 0.03);
      border: 1px solid var(--color-border);
      border-radius: var(--border-radius-card);
      padding: 32px 24px;
      margin: 24px 0 32px 0;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .thermometer-value {
      font-family: var(--font-serif);
      font-size: 4.5rem;
      font-weight: 700;
      color: var(--color-text-main);
      line-height: 1;
      margin-bottom: 8px;
      text-shadow: 0 0 25px rgba(139, 130, 240, 0.45);
    }

    .thermometer-badge {
      display: inline-block;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      background: var(--color-primary-subtle);
      color: var(--color-primary-glow);
      border: 1px solid rgba(139, 130, 240, 0.2);
      margin-bottom: 24px;
    }

    .thermometer-track {
      width: 100%;
      max-width: 440px;
      height: 12px;
      background: rgba(8, 7, 26, 0.7);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(235, 233, 248, 0.1);
    }

    .thermometer-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--color-primary) 0%, var(--color-primary-glow) 100%);
      border-radius: 6px;
      box-shadow: 0 0 14px var(--color-primary-glow);
      transition: width 1.8s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Email Capture Form styling */
    .capture-form {
      width: 100%;
      max-width: 440px;
      margin: 28px auto 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
    }

    .input-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--color-text-secondary);
      font-weight: 500;
    }

    .input-field {
      border: 1px solid var(--color-border);
      border-radius: var(--border-radius-btn);
      padding: 16px 18px;
      font-family: var(--font-sans);
      font-size: 1.05rem;
      color: var(--color-text-main);
      background-color: var(--color-bg-card);
      outline: none;
      transition: border-color var(--transition-fade), box-shadow var(--transition-fade), background-color var(--transition-fade);
      width: 100%;
    }

    .input-field:focus {
      border-color: var(--color-primary-glow);
      box-shadow: 0 0 12px rgba(139, 130, 240, 0.25);
      background-color: rgba(16, 15, 46, 0.95);
    }

    .input-field::placeholder {
      color: rgba(148, 144, 184, 0.45);
    }

    .inline-error-msg {
      font-size: 0.85rem;
      color: #ff5252;
      margin-top: 4px;
      display: none;
    }

    .input-group.has-error .input-field {
      border-color: #ff5252;
    }

    .input-group.has-error .inline-error-msg {
      display: block;
    }

    /* Analysis Loading Screen styling */
    .analysis-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 460px;
      margin: 0 auto;
      width: 100%;
    }

    .spinner-ring-container {
      position: relative;
      width: 76px;
      height: 76px;
      margin-bottom: 36px;
    }

    .spinner-background-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 2px solid rgba(139, 130, 240, 0.08);
      border-radius: 50%;
    }

    .spinner-spinning-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 2px solid transparent;
      border-top-color: var(--color-primary-glow);
      border-radius: 50%;
      animation: rotate 1.2s infinite cubic-bezier(0.5, 0, 0.5, 1);
    }

    .spinner-center-star {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.35rem;
      color: var(--color-primary-glow);
      animation: pulse 2s infinite ease-in-out;
    }

    .analysis-steps-list {
      width: 100%;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .analysis-step-row {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.05rem;
      color: var(--color-text-secondary);
      opacity: 0.3;
      transition: all var(--transition-fade);
    }

    .analysis-step-row.active {
      opacity: 1;
      color: var(--color-text-main);
    }

    .analysis-step-row.completed {
      opacity: 1;
      color: var(--color-text-main);
    }

    .analysis-step-row.completed .step-row-icon {
      color: var(--color-integration);
      text-shadow: 0 0 6px rgba(34, 184, 160, 0.5);
      font-weight: bold;
    }

    .step-row-icon {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-weight: 500;
    }

    /* Result Screen Premium styling */
    .result-outer-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .result-glow-header {
      position: relative;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 0 16px 0;
      z-index: 10;
    }

    .result-glow-halo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139, 130, 240, 0.16) 0%, rgba(8, 7, 26, 0) 70%);
      z-index: -1;
      filter: blur(25px);
      pointer-events: none;
      animation: pulse 4s infinite ease-in-out;
    }

    .result-top-badge {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.20em;
      color: var(--color-primary-glow);
      margin-bottom: 12px;
      font-weight: 600;
      text-shadow: 0 0 10px rgba(139, 130, 240, 0.3);
    }

    .result-main-title {
      font-size: 2.1rem;
      line-height: 1.3;
      margin-bottom: 8px;
      color: var(--color-text-main);
    }

    @media (min-width: 600px) {
      .result-main-title {
        font-size: 2.6rem;
      }
    }

    .profile-glow-name {
      color: var(--color-primary-glow);
      font-family: var(--font-serif);
      font-style: italic;
      display: block;
      margin-top: 6px;
      font-size: 2.3rem;
      text-shadow: 0 0 20px rgba(139, 130, 240, 0.35);
    }

    @media (min-width: 600px) {
      .profile-glow-name {
        font-size: 3rem;
      }
    }

    /* 3D Orb Visual container */
    .orb-visual-box {
      position: relative;
      width: 150px;
      height: 150px;
      margin: 8px auto 24px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .orb-background-fog {
      position: absolute;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--color-primary-glow) 0%, rgba(8, 7, 26, 0.8) 75%);
      opacity: 0.22;
      animation: orbRotate 12s infinite linear;
      filter: blur(8px);
    }

    .orb-core-sphere {
      position: relative;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--color-primary-glow) 0%, var(--color-primary) 50%, rgba(16, 15, 46, 0) 100%);
      box-shadow: 0 0 30px rgba(139, 130, 240, 0.45), inset 0 0 18px rgba(75, 63, 212, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: float 4s infinite ease-in-out;
    }

    .orb-core-sphere::after {
      content: "✧";
      color: var(--color-text-main);
      font-size: 1.7rem;
      opacity: 0.9;
      text-shadow: 0 0 8px var(--color-text-main);
    }

    /* Narrative text blocks */
    .result-text-article {
      display: flex;
      flex-direction: column;
      gap: 20px;
      text-align: left;
    }

    .result-paragraph {
      font-size: 1.1rem;
      line-height: 1.7;
      color: var(--color-text-secondary);
      font-weight: 300;
    }

    .result-paragraph strong {
      color: var(--color-text-main);
      font-weight: 500;
    }

    /* Integration final block ("O que muda") */
    .integration-box-card {
      background-color: var(--color-bg-affirmation);
      border: 1px solid rgba(34, 184, 160, 0.22);
      border-radius: var(--border-radius-card);
      padding: 28px 24px;
      margin-top: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    .integration-box-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background-color: var(--color-integration);
    }

    .integration-box-title {
      font-family: var(--font-serif);
      font-size: 1.35rem;
      color: var(--color-text-main);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .integration-box-title::before {
      content: "✧";
      color: var(--color-integration);
      font-size: 1.1rem;
      text-shadow: 0 0 6px rgba(34, 184, 160, 0.5);
    }

    .integration-box-text {
      font-size: 1.08rem;
      line-height: 1.7;
      color: var(--color-integration);
      opacity: 0.95;
      font-weight: 300;
    }

    /* KEYFRAME ANIMATIONS */
    @keyframes float {
      0%, 100% {
        transform: translateY(0px) scale(1);
      }
      50% {

          }

                <!-- Corpo Narrativo do Perfil -->
                <article class="result-text-article">

                <section class="integration-box-card">

                    ${injectedIntegration}

                <!-- Divisor Visual com Glow -->
                <hr class="sales-divider" aria-hidden="true">

                <!-- Tela de Transição para Vendas -->
                <section class="sales-transition-block" id="sales-section">
                  <h2 class="sales-transition-title">
                    Identificar a sua sombra foi o primeiro passo.<br>
                    <span class="color-int">O segundo é integrá-la.</span>
                  </h2>
                  <p class="sales-transition-paragraph">
                    Saber qual sombra te sabota não faz ela parar. Você provavelmente já percebeu isso: entender nunca foi o seu problema. O que faltou foi um processo que chegasse onde a sombra realmente vive.
                  </p>
                  <p class="sales-transition-paragraph">
                    Foi exatamente para isso que criamos o Protocolo de 3 Dias: um processo estruturado para você encontrar, dialogar e integrar a sombra que está operando por trás da sua autossabotagem. Não em anos. Em 3 dias.
                  </p>
                  <p class="sales-profile-paragraph">
                    ${profileSpecificText}

                <!-- Cartão do Produto + Order Bump -->
                <section class="product-card-wrapper">
                  <div class="product-card">
                    <span class="product-card-label">TRABALHO INTERIOR · PROTOCOLO</span>
                    <h3 class="product-card-title">O Protocolo dos 3 Dias</h3>
                    <p class="product-card-subtitle">Três dias. Um protocolo. Uma sombra integrada.</p>
                    
                    <ul class="product-features-list">
                      <li>
                        <span class="feature-emoji">🌑</span>
                        <span class="feature-text">O protocolo completo dos 3 dias, com processo e exercício central por dia</span>
                      </li>
                      <li>
                        <span class="feature-emoji">📍</span>
                        <span class="feature-text">Cada dia tem um objetivo claro, uma prática específica e um comprometimento real</span>
                      </li>
                      <li>
                        <span class="feature-emoji">🧠</span>

                      </li>
                      <li>
                        <span class="feature-emoji">⚡</span>
                        <span class="feature-text">Acesso imediato em PDF, você executa hoje</span>
                      </li>
                    </ul>
                    
                    <div class="product-price-block">
                      <span class="price-old">R$ 97</span>
                      <span class="price-current">R$ 27</span>
                      <span class="price-microcopy">Oferta disponível apenas nesta página.</span>
                    </div>
                    
                    <button id="btn-buy-protocol" class="btn-buy-now">QUERO EXECUTAR O PROTOCOLO →</button>
                    
                    <div class="product-guarantees">
                      <p>🔒  Pagamento 100% seguro</p>
                      <p>↩️  Garantia de 7 dias. Se não fizer sentido pra você, devolvemos.</p>
                    </div>
                  </div>
                  
                  <!-- Order Bump Section -->
                  <div class="order-bump">
                    <div class="bump-container">
                      <div class="bump-checkbox-wrapper">
                        <div id="bump-checkbox" class="bump-styled-checkbox checked" role="checkbox" aria-checked="true" tabindex="0">
                          <span class="bump-check-mark">✓</span>
                        </div>
                      </div>
                      
                      <div class="bump-content">
                        <p class="bump-title">Sim, adicionar o Pack de Prompts de IA por +R$ 17</p>
                        <p class="bump-description">
                          Mais de 30 prompts prontos para fazer shadow work com qualquer IA, com uma trilha específica para integrar sua ${sombraName}. Funciona com ChatGPT, Claude ou qualquer IA de texto.

                        <p class="bump-microcopy">Adicionado automaticamente ao pedido. Desmarque se não quiser.</p>

        },
        setup: () => {
          // Scroll suave para a seção de venda
          const btnScroll = document.getElementById("btn-scroll-to-sales");
          if (btnScroll) {
            btnScroll.addEventListener("click", () => {
              const salesSec = document.getElementById("sales-section");
              if (salesSec) {
                salesSec.scrollIntoView({ behavior: "smooth" });
              }
            });
          }

          const bumpCheckbox = document.getElementById("bump-checkbox");
          let upsellAccepted = true;
          
          if (bumpCheckbox) {
            bumpCheckbox.addEventListener("click", () => {
              upsellAccepted = !upsellAccepted;
              if (upsellAccepted) {
                bumpCheckbox.classList.add("checked");
                bumpCheckbox.setAttribute("aria-checked", "true");
              } else {
                bumpCheckbox.classList.remove("checked");
                bumpCheckbox.setAttribute("aria-checked", "false");
              }
            });
            
            // Keydown support
            bumpCheckbox.addEventListener("keydown", (e) => {
              if (e.key === " " || e.key === "Enter") {
                e.preventDefault();
                bumpCheckbox.click();
              }
            });
          }
          
          const buyButton = document.getElementById("btn-buy-protocol");
          if (buyButton) {
            buyButton.addEventListener("click", () => {
              const valorBase = 27;
              const valorUpsell = upsellAccepted ? 17 : 0;
              const valorTotal = valorBase + valorUpsell;
              
              let perfilName = "";
              if (state.winnerProfile === "A") perfilName = "Sombra do Abandono";
              else if (state.winnerProfile === "B") perfilName = "Sombra da Indignidade";
              else if (state.winnerProfile === "C") perfilName = "Sombra do Controle";
              else if (state.winnerProfile === "D") perfilName = "Sombra da Invisibilidade";

              console.log("Compra Efetuada:", {
                produto: "Protocolo de 3 Dias",
                valor: valorBase,
                upsell: upsellAccepted,
                valorUpsell: valorUpsell,
                valorTotal: valorTotal,
                perfil: perfilName
              });
              
              // Dispara o Pixel do Facebook para InitiateCheckout
              fbq('track', 'InitiateCheckout');
              
              // Abre o checkout da Kiwify em nova aba
              window.open('https://pay.kiwify.com.br/APFNbz9', '_blank');
              
              // Exibir tela de confirmação simples
              renderConfirmationScreen();
            });
          }
        }
      }
    ];

    // --- SETUP PARA AS SELEÇÕES ÚNICAS (P1, P2, P3, P4, P5, P6, P8, P9) ---
    function setupSingleChoice(questionId) {
      const cards = document.querySelectorAll(".option-card");
      const savedResponse = state.responses[questionId];

      // Re-aplica visual se já houver resposta armazenada
      if (savedResponse) {
        cards.forEach(card => {
          if (card.getAttribute("data-val") === savedResponse) {
            card.classList.add("selected");
          }
        });
      }

      cards.forEach(card => {
        card.addEventListener("click", () => {
          // Remove seleção prévia
          cards.forEach(c => c.classList.remove("selected"));
          
          // Adiciona seleção atual
          card.classList.add("selected");
          
          // Salva no objeto em memória
          const selectedVal = card.getAttribute("data-val");
          state.responses[questionId] = selectedVal;

          // Aguarda exatos 350ms de pausa de feedback antes de avançar automaticamente
          setTimeout(() => {
            nextScreen();
          }, 350);
        });
      });
    }

    // --- SETUP PARA SELEÇÃO MÚLTIPLA (P7) ---
    function setupMultipleChoice() {
      const cards = document.querySelectorAll(".option-card");
      const nextBtn = document.getElementById("btn-p7-next");
      
      // Carrega seleções armazenadas em memória se existirem
      let selectedIndices = state.responses["P7"] || [];
      
      if (selectedIndices.length > 0) {
        cards.forEach(card => {
          const idx = parseInt(card.getAttribute("data-index"));
          if (selectedIndices.includes(idx)) {
            card.classList.add("selected");
          }
        });
        nextBtn.classList.remove("hidden-btn");
        nextBtn.classList.add("show-btn");
      }

      cards.forEach(card => {
        card.addEventListener("click", () => {
          const idx = parseInt(card.getAttribute("data-index"));
          
          if (card.classList.contains("selected")) {
            card.classList.remove("selected");
            selectedIndices = selectedIndices.filter(i => i !== idx);
          } else {
            card.classList.add("selected");
            selectedIndices.push(idx);
          }

          state.responses["P7"] = selectedIndices;

          // Exibe ou oculta botão de acordo com seleção mínima
          if (selectedIndices.length > 0) {
            nextBtn.classList.remove("hidden-btn");
            nextBtn.classList.add("show-btn");
          } else {
            nextBtn.classList.remove("show-btn");
            nextBtn.classList.add("hidden-btn");
          }
        });
      });

      nextBtn.addEventListener("click", () => {
        nextScreen();
      });
    }

    // --- ATUALIZADOR DA BARRA DE PROGRESSO REAL ---
    function updateProgressBar(screen) {
      const percent = PROGRESS_MAP[screen.id];
      if (percent !== undefined) {
        progressContainer.classList.remove("hidden");
        progressBar.style.width = `${percent}%`;
      } else {
        progressContainer.classList.add("hidden");
        progressBar.style.width = "0%";
      }
    }

    // --- RENDERIZADOR DO BOTÃO DE VOLTAR INLINE ---
    function renderBackButton(screen) {
      const noBackScreens = ["analysis", "result"];
      
      if (state.currentScreenIndex === 0 || noBackScreens.includes(screen.id)) {
        backButtonContainer.innerHTML = "";
      } else {
        backButtonContainer.innerHTML = `
          <button id="btn-action-back" class="btn-back">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>Voltar</span>
          </button>
        `;
        
        document.getElementById("btn-action-back").addEventListener("click", () => {
          prevScreen();
        });
      }
    }

    // --- GERENCIADOR DE TRANSITIONS DE TELA (300ms) ---
    function renderScreen(index) {
      const screen = SCREENS[index];
      if (!screen) return;

      const currentScreenEl = screenViewport.querySelector(".screen");
      if (currentScreenEl) {
        currentScreenEl.classList.add("fade-out");
        // Aguarda fim do fade-out (300ms) antes de injetar e fade-in o próximo
        setTimeout(() => {
          injectAndSetupScreen(screen);
        }, 300);
      } else {
        injectAndSetupScreen(screen);
      }
    }

    function injectAndSetupScreen(screen) {
      screenViewport.innerHTML = screen.render();
      
      // Scroll suave ao topo da tela
      window.scrollTo({ top: 0, behavior: "smooth" });

      // Modo de Afirmação (fundo teal escuro de pausa)
      if (screen.type === "affirmation") {
        body.classList.add("affirmation-mode");
      } else {
        body.classList.remove("affirmation-mode");
      }

      updateProgressBar(screen);
      renderBackButton(screen);

      if (screen.setup) {
        screen.setup();
      }
    }

    // --- CONTROLE DE NAVEGAÇÃO ---
    function nextScreen() {
      if (state.currentScreenIndex < SCREENS.length - 1) {
        state.currentScreenIndex++;
        renderScreen(state.currentScreenIndex);
      }
    }

    function prevScreen() {
      if (state.currentScreenIndex > 0) {
        state.currentScreenIndex--;
        renderScreen(state.currentScreenIndex);
      }
    }

    // --- TELA DE CONFIRMAÇÃO DO PROTOCOLO ---
    function renderConfirmationScreen() {
      progressContainer.classList.add("hidden");
      backButtonContainer.innerHTML = "";
      body.classList.add("affirmation-mode");
      
      screenViewport.innerHTML = `
        <div class="screen">
          <div class="affirmation-box" style="padding: 40px 20px;">
            <span class="affirmation-badge" style="font-size: 2.5rem; margin-bottom: 24px;">✧</span>
            <h1 style="font-family: var(--font-serif); font-size: 2rem; color: var(--color-text-main); line-height: 1.4; text-align: center; margin-bottom: 20px;">
              Obrigado!
            </h1>
            <p style="font-family: var(--font-sans); font-size: 1.15rem; color: var(--color-text-secondary); line-height: 1.7; text-align: center; max-width: 500px;">
              Seu acesso está sendo preparado.<br>
              Em instantes você receberá um e-mail de confirmação.
            </p>
          </div>
        </div>
      `;
    }

    // --- CARGA INICIAL DO QUIZ ---
    renderScreen(state.currentScreenIndex);

  </script>
</body>
